name: Publish container images

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+[ab][0-9]+"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions: {}

jobs:
  build:
    permissions:
      contents: read
      packages: write
    name: Build ${{ matrix.variant }} (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
        variant: [CUDA, CUDA130, CPU]
        exclude:
          - architecture: amd64
            variant: CUDA130
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - variant: CUDA
            dockerfile: Dockerfile
            build_args: |
              BASE_IMAGE=nvidia/cuda:12.6.0-devel-ubuntu24.04
              TORCH_EXTRA=cuda
          - variant: CUDA130
            dockerfile: Dockerfile
            build_args: |
              BASE_IMAGE=nvidia/cuda:13.0.2-devel-ubuntu24.04
              TORCH_EXTRA=cuda-130
          - variant: CPU
            dockerfile: Dockerfile.cpu
            build_args: BASE_IMAGE=ubuntu:24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: image
        shell: bash
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=${image_name}" >> "${GITHUB_OUTPUT}"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: ${{ matrix.build_args }}
          push: true
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache-${{ matrix.variant }}-${{ matrix.architecture }}
          cache-to: type=registry,mode=max,ref=${{ steps.image.outputs.name }}:buildcache-${{ matrix.variant }}-${{ matrix.architecture }}

      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: digests-${{ matrix.variant }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    permissions:
      packages: write
    name: Publish ${{ matrix.variant.name }} image
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: CUDA
            suffix: ""
            architectures: [amd64, arm64]
          - name: CUDA130
            suffix: -cu130-arm64
            architectures: [arm64]
          - name: CPU
            suffix: -cpu
            architectures: [amd64, arm64]

    steps:
      - name: Download image digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.variant.name }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish and verify image
        env:
          IMAGE_SUFFIX: ${{ matrix.variant.suffix }}
          CUDA_ALIAS: ${{ matrix.variant.name == 'CUDA' }}
          EXPECTED_ARCHITECTURES: ${{ toJSON(matrix.variant.architectures) }}
        working-directory: ${{ runner.temp }}/digests
        shell: bash
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          versions=("${GITHUB_SHA::7}")
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            versions+=("${GITHUB_REF_NAME}")
          fi
          tags=()
          for version in "${versions[@]}"; do
            tags+=("${image_name}:${version}${IMAGE_SUFFIX}")
            if [[ "${CUDA_ALIAS}" == "true" ]]; then
              tags+=("${image_name}:${version}-cuda")
            fi
          done
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(--tag "${tag}")
          done
          expected_count="$(jq 'length' <<< "${EXPECTED_ARCHITECTURES}")"
          digests=(*)
          if [[ "${#digests[@]}" -ne "${expected_count}" ]]; then
            echo "Expected ${expected_count} architecture digests, found ${#digests[@]}." >&2
            exit 1
          fi
          images=()
          for digest in "${digests[@]}"; do
            images+=("${image_name}@sha256:${digest}")
          done
          docker buildx imagetools create "${tag_args[@]}" "${images[@]}"
          for tag in "${tags[@]}"; do
            docker buildx imagetools inspect "${tag}"
            docker buildx imagetools inspect "${tag}" --raw |
              jq -e --argjson expected "${EXPECTED_ARCHITECTURES}" \
                '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ($expected | sort)'
          done
